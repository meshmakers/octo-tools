# Dependabot standard configuration.
# One entry per ecosystem and manifest directory list, run monthly. All minor and patch updates
# of an ecosystem arrive in one pull request per manifest directory; the low
# open-pull-requests-limit keeps majors that are not ignored from piling up. The majors we hold
# on purpose are ignored (remove an ignore only together with the story that delivers that
# migration).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "nuget"
    directory: "/devstack"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      runtime-aligned:
        patterns: ["Microsoft.Extensions.*", "Microsoft.AspNetCore.*", "System.Text.Json", "System.Composition.*", "System.IdentityModel.Tokens.Jwt"]
        update-types: ["minor", "patch"]
      test-tooling:
        patterns: ["xunit*", "TUnit*", "Microsoft.NET.Test.Sdk", "coverlet.*", "Moq", "NSubstitute", "FakeItEasy", "FluentAssertions"]
        update-types: ["minor", "patch"]
      meshmakers:
        patterns: ["Meshmakers.*"]
        update-types: ["minor", "patch"]
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # AB#9580
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      # AB#9580
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      # AB#9580
      - dependency-name: "System.Text.Json"
        update-types: ["version-update:semver-major"]
      # AB#9580
      - dependency-name: "System.Composition.*"
        update-types: ["version-update:semver-major"]
      # MassTransit 9 is held on purpose
      - dependency-name: "MassTransit*"
        update-types: ["version-update:semver-major"]
      # Telerik majors follow a licensed upgrade
      - dependency-name: "Telerik.*"
        update-types: ["version-update:semver-major"]
      # KubeOps majors are planned migrations
      - dependency-name: "KubeOps.*"
        update-types: ["version-update:semver-major"]
