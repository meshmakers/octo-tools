# Local dev values for octo-mesh-communication-operator (central mode).
# CRDs are installed separately by Install-OctoKubernetes.
octo-mesh-crds:
  enabled: false

image:
  repository: meshmakers/octo-communication-operator
  # The operator runs the rolling :main-latest tag (CI republishes it on every main
  # build), so the image content changes under a fixed tag — IfNotPresent would keep
  # serving the node's stale cached layer and a re-deploy would never pick up a newer
  # build. Default to Always so every (re)deploy re-pulls. Deploy-OctoOperator drops
  # this back to IfNotPresent for offline/pre-loaded (-SkipRegistryCheck) deploys.
  pullPolicy: Always
  # Pull the operator's own image from the dev registry, same place the adapter / app
  # images come from. Deploy-OctoOperator injects `registry.url` from your octo-tools
  # config (~/.config/octo-tools/installations.json) here. Set a host to override the
  # config for this checkout; keep empty to use the config (empty config = Docker Hub).
  privateRegistry: ""
  tag: ""            # set via --set image.tag=... (Install-OctoKubernetes uses main-latest)

operator:
  autoManageDeploymentSites: true
  deploymentSiteNamespace: octo
  defaultDeploymentSiteName: default
  # Pull adapter / application images from the dev registry (where the multi-arch
  # images are published) instead of public Docker Hub. The operator projects this
  # as image.privateRegistry into EVERY deployed workload (operator-wide). NOTE the
  # image TAG is not projected — set image.tag per adapter (e.g. main-latest) in
  # Studio, since the chart's default tag is the chart appVersion. Requires the dev
  # registry to be reachable + pullable from the cluster (anon pull, else add a
  # docker-registry secret + imagePullSecrets per adapter — the operator's
  # adapterImagePullSecretName is currently a no-op).
  # Injected by Deploy-OctoOperator alongside image.privateRegistry (same host,
  # from `registry.url` in the octo-tools config) unless privateRegistry above
  # is set — then set this to the same value here.
  imageRegistry: ""
  # (adapterIgnoreCertificateValidation was removed here: it is a no-op — the operator
  # never projects it and no workload chart consumes it. Workload TLS trust is
  # delivered instead by Deploy-OctoOperator handing the host dev certificate to the
  # chart as secrets.rootCa, which the operator projects into every workload, where
  # the adapter chart's trust initContainer splices it into /etc/ssl/certs.)
  communicationControllerUri: ""   # set via --set to https://<host-LAN-IP>:5015
  # Identity authority the operator projects into every workload it deploys. Adapters
  # validate bearer tokens against it, so without this a secured FromHttpRequest@2
  # route rejects every caller: the adapter falls back to its compiled-in loopback
  # default, refuses to use it, and disables JWT authentication altogether. Same host
  # as the controller above — identity runs beside it as a host process.
  authUri: ""                      # set via --set to https://<host-LAN-IP>:5003
  # Extra token issuers every deployed workload accepts on top of authUri (AB#5232).
  # Locally, adapters reach identity via https://host.docker.internal:5003 (the SAN
  # the dev certificate carries), but host-side callers (octo-cli, curl, E2E scripts)
  # mint their tokens via https://localhost:5003 — so those tokens carry issuer
  # https://localhost:5003/ and a secured FromHttpRequest route would answer 401
  # issuer_invalid without this entry. Widens only the issuer string comparison;
  # signing keys still come from authUri's discovery document. Requires an operator
  # image with AB#5232 (OPERATOR__ADDITIONALVALIDISSUERS support); older images
  # ignore the env var harmlessly.
  additionalValidIssuers:
    - "https://localhost:5003/"
  # Cluster-wide ingress defaults the operator projects into EVERY deployed
  # workload's ingress — match this to the issuer set up by Install-OctoKubernetes
  # so deployed workloads get a cert-manager-issued, trusted cert with no per-app
  # change. Without this the operator renders a bare `ingress.enabled: true` (no
  # className / cluster-issuer / tls), so cert-manager issues no cert and
  # ingress-nginx serves its self-signed "Fake Certificate".
  ingress:
    className: nginx
    clusterIssuer: mm-cloud-issuer
    tls: true
  clusterDependencies:
    mongodbHost: "mongodb-0.mongodb.octo-infra.svc.cluster.local:27017"
    mongodbReplicaSet: "rs"
    rabbitMqHost: "rabbitmq.octo-infra.svc.cluster.local"
    rabbitMqUser: "guest"
    streamDataHost: "cratedb.octo-infra.svc.cluster.local"
    streamDataUser: "octo-system"
  clusterSecrets:
    mongodbUserPassword: "OctoUser1"
    mongodbAdminPassword: "OctoAdmin1"
    # The local single-node CrateDB runs auth-less, but the octo-mesh-adapter /
    # octo-eda-adapter charts unconditionally require secrets.streamDataPassword
    # (no features.streamData gate, unlike octo-plug-simulation). The operator
    # only injects ClusterSecrets fields that are non-empty, so leaving this blank
    # makes the chart render fail ("secrets.streamDataPassword must be set"). A
    # dummy value satisfies the chart; CrateDB ignores it.
    streamDataPassword: "OctoStream1"

broker:
  host: "rabbitmq.octo-infra.svc.cluster.local"
  virtualHost: "/"
  port: 5672
  username: "guest"
  password: "guest"

# The chart's default 128Mi is too tight: the operator forks the helm CLI
# for every workload deploy, and helm + the .NET host together blow the
# limit (containerd OOM-kills the pod with exitCode 137, restart loop on
# every retried workload deploy). 512Mi gives helm + index parsing
# comfortable headroom on local kind.
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi
